; Fight With Me: names and words for followers' unique traits.
;
; Fight With Me looks for combat abilities from the companion's original plugin. Shared
; overhaul/framework perks do not count. Script-only abilities and alias event handlers need
; a named entry here: an event can be dialogue or housekeeping rather than a combat move.
; Any .ini in this folder is read, so a follower mod can ship its own.
;
; [Plugin.esp|FormID]  the perk, spell or quest a trait comes from, its id as that plugin has it
; [Script:Name]        a script on their own quest's alias that answers a fight
;
; Name = what the player sees. Traits with the same name are one trait.
; What = one line on what it does.
; When = optional trigger description, useful for scripted moves.
; Kind = Strike, Evade, Summon, Aura, On hit, Instinct or Nerve.
; Hide = 1 leaves it out.
;
; Plain English letters only, or save the file as UTF-16.

; --- Katana (Katana and Megara) ---------------------------------------------------------------

; Her shadow attack: a script starts it when a fight begins, a perk on her power attacks.
[Katana.esp|0x8307F1]
Name = Shadow Step
What = Vanishes in mist and strikes from behind her target, while it is still fresh.
Kind = Strike

[Script:AK69KatanaDialogueQuestAliasScript]
Name = Shadow Step
What = Vanishes in mist and strikes from behind her target, while it is still fresh.
When = When a fight starts
Kind = Strike

[Katana.esp|0x4CEC2D]
Name = Mist Raven
What = Turns to mist for a moment: unseen, untouchable, and unnerving to those near her.
Kind = Evade

[Katana.esp|0x0F8CDC]
Name = Spectral Warband
What = Calls her shadow to fight beside her when she is badly hurt.
Kind = Summon

; --- Megara (Katana and Megara) ---------------------------------------------------------------

; The script applies one of eight chosen buffs. They are modes of one ability.
[Katana.esp|0xA3F9CE]
Name = Battle Boon
What = Bolsters your chosen combat skill, magicka or stamina when battle begins.
Kind = Aura

; Only the combat-start handler casts invisibility; OnHit updates follower packages.
[Script:AK69MegaraDialogueQuestAliasScript]
Name = Shadow Cloak
What = Becomes invisible when a fight starts while Shadow mode is enabled.
When = When combat starts in Shadow mode
Kind = Evade
