; Fight With Me
; Battle orders for your companions: a role, a focus and a place in the fight for each,
; set in the battle plan and kept in your save; this file holds the rules behind them.
; Fight With Me changes whom they fight and where they stand, never what their attacks do.
; Abilities, unique traits and levels earned by fighting are Path of the Companions'.
;
; Forms are written as Plugin|0xLocalID. Leave one empty to turn that effect off.
;
; What you change in the in-game settings (Mod Configuration > Fight With Me) is
; saved to FightWithMe_user.ini, read after this file. Updates replace this file but
; never that one; delete it to come back to the values here.

[General]
bEnabled = true
; How far a role and a position move a companion: how far they keep, whether they circle,
; fall back or work round to the side. 0 to 1. At 0 a role only changes whom they fight.
; What they attack with, and how, is never changed.
fStyleWeight = 0.75
; Seconds between target decisions.
fDecisionInterval = 0.3
; The first time a companion is seen, pick a role from what they carry (shield:
; Tank, two-hander: Bruiser, bow: Archer, staff or spells: Mage or Healer) or
; from their NFF combat role.
bGuessRoles = true
; End a companion's combat once no enemy is left (weapons out, nobody to fight), so
; they fall back into Walk With Me's formation.
bLeaveEmptyFights = true
fLeaveAfter = 2.5

[Loadout]
; Each role keeps to its own weapons: a Bruiser to a two-hander, a Mage or Healer to a staff
; beside its spells, and with Path of the Companions every role to its path's weapons
; (Fighters one-handed, Archers bows, and so on). false: any role may use any weapon or
; shield the companion carries, a Bruiser no longer needs a two-hander, and nothing is
; greyed out in the weapon pools. Weapon pools you choose still apply. The Skald keeps its
; lute either way.
bRoleWeapons = true

[Sight]
; Auto battle: a companion who sees an enemy starts the fight instead of waiting to be
; attacked. Companions on Hold back never start one, and nobody does while you sneak.
; Also a switch at the top right of the battle plan. Off, nothing happens before a
; fight: companions wait for one with their weapons away.
bAutoBattle = false
; With auto battle on, an enemy within fRange that a companion or you can see brings
; their weapons out (not while you sneak). They put them away a few seconds after the
; last one is out of view, unless yours are out. Weapons are drawn once per sighting:
; if the game puts them away, they stay away. Unaggressive wildlife (a fox, an elk)
; counts only once it is in a fight.
bDrawWeapons = true
fRange = 2500

[Orders]
; Party orders for the whole fight, with or without the battle plan open. They bend
; everyone's orders until the fight is over and never change what each one was told.
; DirectInput scan codes, laid out like a D-pad on the numpad. 0 = none.
; Each can need a modifier held with it: 42 Shift, 29 Ctrl, 56 Alt (either side
; counts), 0 none. A key with no modifier works whatever else is held.
; Attack!: everyone goes for your target. 72 = Numpad 8.
iAttack = 72
iAttackModifier = 0
; To me!: everyone comes back to your side and fights there. 77 = Numpad 6.
iToMe = 77
iToMeModifier = 0
; Hold back: everyone stays back. 75 = Numpad 4.
iHoldBack = 75
iHoldBackModifier = 0
; As you were: everyone back to their own orders. 80 = Numpad 2.
iAsYouWere = 80
iAsYouWereModifier = 0

[BattlePlan]
; DirectInput scan code. 71 = Numpad 7. 0 = none.
iKey = 71
; Held with it: 42 Shift, 29 Ctrl, 56 Alt, 0 none.
iKeyModifier = 0
; Gamepad: hold LB and press this button. 1 D-pad up, 2 D-pad down, 4 left,
; 8 right, 4096 A, 8192 B, 16384 X, 32768 Y, 128 right stick. 0 = none.
iGamepadKey = 2
; How fast the world runs while the plan is open.
fTimeScale = 0.1
; Pause the game instead of slowing it.
bStopTime = false
; Seconds to ease in and out of slow time.
fEaseSeconds = 0.25
; The Slow Time shout's screen effect while planning. It washes the picture out.
bTimeEffect = false
; Hide the HUD (and other interface movies) while planning.
bHideHUD = true
; Ease the camera over to the companion you are commanding, and back on close.
bCameraGlide = true
fCameraDistance = 260
fCameraHeight = 70
; With no enemies about, the camera comes face to face with the chosen companion, this close.
fPortraitDistance = 95
; Menu scale on top of the screen-height scaling.
fScale = 1.0
; How fast the right stick, or dragging with the right mouse button, turns the view.
fOrbitSpeed = 1.0
; The overhead view: the whole fight from above. Switch to it in the plan with this key
; (76 = Numpad 5) or the button top left; on the gamepad with 128 right stick click,
; 64 left stick click or 32 Back. 0 = none. Needs bCameraGlide.
iOverheadKey = 76
iOverheadKeyModifier = 0
iOverheadGamepadKey = 128
; How steeply it looks down when it first opens, in degrees above the horizon (35 to 88).
fOverheadPitch = 70
; When something blocks the view from above (a cave roof, a ceiling, an overhang), leave
; out everything above the tallest fighter's head so nobody is hidden, and cut this far
; above that head. In the open nothing is cut.
bCutaway = true
fCutawayMargin = 60

[Targeting]
; Between two enemies that fit the focus, the nearer is preferred up to this far.
; Distance never rules an enemy out: an ordered target is chased wherever it is.
fEngageRange = 2500
; Guard you: enemies this close to you.
fGuardRadius = 700
; Hold back (melee): enemies this close to the companion.
fHoldBackRadius = 450
; With me (what To me! gives everyone): they keep this close to you and fight from there.
; Melee companions take anything that comes near you, anything on you from close by and
; an enemy on them within fDefendRange; with nothing in reach they hold by you. Archers
; and casters shoot the nearest enemy, however far.
fWithMeRadius = 400
; An enemy attacking a companion from this close is dealt with first, whatever their
; focus or position. Your target and a marked enemy are orders and still come first.
fDefendRange = 500
; How much a companion prefers to stay on their current target.
fStickiness = 25
; How much they avoid an enemy others are already on, per ally.
fSpreadPenalty = 15
; Score lost per unit of distance.
fDistanceWeight = 0.04
; Keep companions inside an area around you, as vanilla guards keep to their post:
; they break off chases and come back. Guard you keeps within fGuardRadius, With me
; within fWithMeRadius, Hold back within fHoldBackLeash. Skyrim SE and AE.
bLeash = true
fHoldBackLeash = 1000
; While the battle plan is open, an enemy you send someone after is outlined, through
; walls. The outline is this shader's rim, recoloured warm white (the default is the
; ghost wolf's edge glow, which has no fill).
bMarkGlow = true
sMarkShader = Skyrim.esm|0x0FE68D

[TimeEffect]
sIntro = Skyrim.esm|0x0486F7
sHold = Skyrim.esm|0x0486F4

[Interface]
; Shared style for the battle plan, notices and settings, and Path of the Companions' panel.
; 0 = Vanilla (charcoal and silver), 1 = Oxblood (the original red), 2 = Nordic (engraved stone and metal).
; All themes use the same window placement, navigation and controls; applies to Paths too.
iTheme = 1
; Short notices on the HUD when a companion cannot do what they were told.
bNotices = true
; The game's own menu sounds when you point at and choose orders in the battle plan.
bSounds = true
; Describe each control when you point at it or move to it with the pad.
bTooltips = true
; The language the battle plan, notices and settings are in. Empty follows the game's own
; (sLanguage in Skyrim.ini). Translations are SKSE/Plugins/FightWithMe/Translations/
; <Mod>_<LANGUAGE>.txt; set this to read another, e.g. FRENCH. Takes effect on the next start.
sLanguage =

[Debug]
; Log every target change and style rebuild.
bLogDecisions = false

[PartyBalance]
; Final multiplier for follower weapon, spell and POTC ability damage, independent of party scaling.
; 0 = no damage, 100 = unchanged. Player damage is unaffected.
fFollowerDamage=100
