; Fight With Me
; Battle orders for your companions. Orders for each companion are set in the
; battle plan and kept in your save; this file holds the rules behind them.
;
; Forms are written as Plugin|0xLocalID. Leave one empty to turn that effect off.
;
; What you change in the in-game settings (Mod Configuration > Fight With Me) is
; saved to FightWithMe_user.ini, read after this file. Updates replace this file but
; never that one; delete it to come back to the values here.

[General]
bEnabled = true
; How far a role pulls a companion's own combat style, 0 to 1. At 0 a role only
; changes whom they fight; at 1 it replaces their style outright.
fStyleWeight = 0.75
; Seconds between target decisions.
fDecisionInterval = 0.3
; The first time a companion is seen, pick a role from what they carry (shield:
; Tank, two-hander: Bruiser, bow: Archer, staff or spells: Mage or Healer) or
; from their NFF combat role.
bGuessRoles = true
; End a companion's combat once no enemy is left (weapons out, nobody to fight), so
; they fall back into Walk With Me's formation.
bLeaveEmptyFights = true
fLeaveAfter = 2.5

[Sight]
; Out of a fight, an enemy within fRange that a companion or you can see brings their
; weapons out. They put them away a few seconds after the last one is out of view,
; unless yours are out.
bDrawWeapons = true
; Auto battle: a companion who sees an enemy starts the fight instead of waiting to be
; attacked. Companions on Hold back never start one, and nobody does while you sneak.
; Also a switch at the top right of the battle plan.
bAutoBattle = false
fRange = 2500

[Orders]
; Party orders for the whole fight, with or without the battle plan open. They bend
; everyone's orders until the fight is over and never change what each one was told.
; DirectInput scan codes, laid out like a D-pad on the numpad. 0 = none.
; Each can need a modifier held with it: 42 Shift, 29 Ctrl, 56 Alt (either side
; counts), 0 none. A key with no modifier works whatever else is held.
; Attack!: everyone goes for your target. 72 = Numpad 8.
iAttack = 72
iAttackModifier = 0
; To me!: everyone comes back to your side and fights there. 77 = Numpad 6.
iToMe = 77
iToMeModifier = 0
; Hold back: everyone stays back. 75 = Numpad 4.
iHoldBack = 75
iHoldBackModifier = 0
; As you were: everyone back to their own orders. 80 = Numpad 2.
iAsYouWere = 80
iAsYouWereModifier = 0

[BattlePlan]
; DirectInput scan code. 71 = Numpad 7. 0 = none.
iKey = 71
; Held with it: 42 Shift, 29 Ctrl, 56 Alt, 0 none.
iKeyModifier = 0
; Gamepad: hold LB and press this button. 1 D-pad up, 2 D-pad down, 4 left,
; 8 right, 4096 A, 8192 B, 16384 X, 32768 Y, 128 right stick. 0 = none.
iGamepadKey = 2
; How fast the world runs while the plan is open.
fTimeScale = 0.1
; Pause the game instead of slowing it.
bStopTime = false
; Seconds to ease in and out of slow time.
fEaseSeconds = 0.25
; The Slow Time shout's screen effect while planning. It washes the picture out.
bTimeEffect = false
; Hide the HUD (and other interface movies) while planning.
bHideHUD = true
; Ease the camera over to the companion you are commanding, and back on close.
bCameraGlide = true
fCameraDistance = 260
fCameraHeight = 70
; With no enemies about, the camera comes face to face with the chosen companion, this close.
fPortraitDistance = 95
; Menu scale on top of the screen-height scaling.
fScale = 1.0
; How fast the right stick, or dragging with the right mouse button, turns the view.
fOrbitSpeed = 1.0
; The overhead view: the whole fight from above. Switch to it in the plan with this key
; (76 = Numpad 5) or the button top left; on the gamepad with 128 right stick click,
; 64 left stick click or 32 Back. 0 = none. Needs bCameraGlide.
iOverheadKey = 76
iOverheadKeyModifier = 0
iOverheadGamepadKey = 128
; How steeply it looks down when it first opens, in degrees above the horizon (35 to 88).
fOverheadPitch = 70
; When something blocks the view from above (a cave roof, a ceiling, an overhang), leave
; out everything above the tallest fighter's head so nobody is hidden, and cut this far
; above that head. In the open nothing is cut.
bCutaway = true
fCutawayMargin = 60

[Taunt]
bEnabled = true
; Taunt once as a fight starts, before anyone is in trouble.
bOpener = true
; A tank with a shield raises it against archers and casters shooting at them, turned
; to the nearest and closing on them behind it, and lowers it to fight once anything
; comes within reach.
bShieldWall = true
; Once a taunt is ready, a tank checks every fCheckSeconds and taunts with this
; chance, so taunts come at uneven, natural intervals.
fChance = 0.35
fCheckSeconds = 2
; Reach: 800 units plus 3 per point of the better of Block and Heavy Armor.
fRadiusBase = 800
fRadiusPerSkill = 3
fRadiusMax = 1200
; A tank holds enemies up to their own level plus level / fReachDivisor for
; certain. Each level beyond that loses fFalloffPerLevel of the chance, and
; nothing more than iFalloffLevels beyond can be held at all.
fReachDivisor = 4
fFalloffPerLevel = 0.12
iFalloffLevels = 8
; Bosses and dragons count as this many levels higher.
iBossLevelBonus = 5
; Enemies this many levels below the tank stay held fCowedHoldMult times longer.
iCowedLevelGap = 10
fCowedHoldMult = 1.5
; Seconds an enemy stays on the tank: fHoldSeconds, fHoldSecondsLevel30 once the
; tank reaches level 30, fHoldSecondsLevel60 from level 60.
fHoldSeconds = 10
fHoldSecondsLevel30 = 15
fHoldSecondsLevel60 = 30
; Seconds between taunts: fCooldownBase - fCooldownPerLevel per level, at least fCooldownMin.
fCooldownBase = 14
fCooldownPerLevel = 0.05
fCooldownMin = 8
fStaminaCost = 25
; A hold breaks when the tank gets this far from the enemy.
fHoldBreakDistance = 3000
; An archer or caster shooting at you can be taunted from this far, so their fire goes
; to the tank instead of you. Line of sight is still needed.
fRangedReach = 3000
; A taunt braces the tank for as long as it holds: fArmorBase armor, plus fArmorPerLevel
; for each of their levels, never more than fArmorMax.
bBrace = true
fArmorBase = 10
fArmorPerLevel = 1.5
fArmorMax = 120
; The gold flash on a tank as they taunt, in seconds. 0 turns it off.
fGlowSeconds = 1.2
sSound = Skyrim.esm|0x0FF86A
; Shield bang, weapon flourish, and the war cry for anyone else.
sIdleShield = Skyrim.esm|0x0B8C74
sIdleWeapon = Skyrim.esm|0x0B8C73
sIdleCry = Skyrim.esm|0x0F7C8C

[Heal]
; A healer's heal is their own gift, not a spell: you and everyone in the party within
; fReach of them are healed at once, and it costs no magicka, so anyone can be a Healer.
bEnabled = true
; Seconds between heals.
fCooldown = 60
; Health it gives each: fAmountBase plus fAmountPerLevel for each of the healer's levels,
; never more than fAmountMax.
fAmountBase = 40
fAmountPerLevel = 3.5
fAmountMax = 400
fReach = 4000
; The spells a healer can be given for their hands in the battle plan: any heal, ward, armor,
; cloak or summons, and attack spells up to Novice, then Apprentice from level 10 and Adept
; from 25, never Expert or Master. true lifts the cap on attack spells too.
bAnySpell = false

[Rejuvenate]
; A healer quickens your magicka and every companion's by fRegenBonus percent (100 is twice as
; fast) for fSeconds, fSecondsLevel30 once the healer reaches level 30, fSecondsLevel60
; from level 60. It is ready again after twice as long as it lasts.
bEnabled = true
fRegenBonus = 100
fSeconds = 30
fSecondsLevel30 = 60
fSecondsLevel60 = 180

[Targeting]
; Between two enemies that fit the focus, the nearer is preferred up to this far.
; Distance never rules an enemy out: an ordered target is chased wherever it is.
fEngageRange = 2500
; Guard you: enemies this close to you.
fGuardRadius = 700
; Hold back (melee): enemies this close to the companion.
fHoldBackRadius = 450
; With me (what To me! gives everyone): they keep this close to you and fight from there.
; Melee companions take anything that comes near you, anything on you from close by and
; an enemy on them within fDefendRange; with nothing in reach they hold by you. Archers
; and casters shoot the nearest enemy, however far.
fWithMeRadius = 400
; An enemy attacking a companion from this close is dealt with first, whatever their
; focus or position. Your target and a marked enemy are orders and still come first.
fDefendRange = 500
; How much a companion prefers to stay on their current target.
fStickiness = 25
; How much they avoid an enemy others are already on, per ally.
fSpreadPenalty = 15
; Score lost per unit of distance.
fDistanceWeight = 0.04
; Keep companions inside an area around you, as vanilla guards keep to their post:
; they break off chases and come back. Guard you keeps within fGuardRadius, With me
; within fWithMeRadius, Hold back within fHoldBackLeash. Skyrim SE and AE.
bLeash = true
fHoldBackLeash = 1000
; While the battle plan is open, an enemy you send someone after is outlined, through
; walls. The outline is this shader's rim, recoloured warm white (the default is the
; ghost wolf's edge glow, which has no fill).
bMarkGlow = true
sMarkShader = Skyrim.esm|0x0FE68D

[Specials]
; Each role's special: Bodyguard (tank), Volley (archer), War cry (bruiser), Ward (mage,
; healer), Disarm (fighter). A button in the battle plan, and on their own where each
; companion's switch allows.
bEnabled = true

[Effects]
; Ability visuals from Triumvirate, Elemental Destruction Magic Redux and Vibrant Weapons
; (original Fire Frost Shock). Install and enable all three; their assets are not bundled.
; Healing auras, barriers, wind/earth bursts and weapon particles; red still marks taunts.
; A missing source uses vanilla fallback FX and is named in FightWithMe.log.
bEnabled = true

[PathBonus]
; With the Paths add-on: every point a companion spends on their role's path makes them
; a little better at what the role is for, in percent per point. Only the path of the
; role they have now counts. The path page shows it beside the path's name.
; Fighter: attack speed. Tank: less damage from every blow, arrow and harmful spell (75%
; at most). Healer: healing, from their abilities, the spells they cast and the potions
; they drink. Bruiser: damage. Archer: the chance an arrow they shoot is not used up (90%
; at most). Mage: less magicka for every spell (75% off at most).
fFighterAttackSpeed = 1
fTankDamageTaken = 1
fHealerHealing = 1
fBruiserDamage = 1
fArcherArrowsKept = 1
fMageMagickaCost = 1

[TimeEffect]
sIntro = Skyrim.esm|0x0486F7
sHold = Skyrim.esm|0x0486F4

[Interface]
; Shared style for the battle plan, Paths, notices and settings.
; 0 = Vanilla (charcoal and silver), 1 = Oxblood (the original red), 2 = Nordic (engraved stone and metal).
; All themes use the same window placement, navigation and controls; applies to Paths too.
iTheme = 1
; Short notices on the HUD when a tank taunts or a healer heals.
bNotices = true
; The game's own menu sounds when you point at and choose orders in the battle plan.
bSounds = true
; Describe each control when you point at it or move to it with the pad.
bTooltips = true
; The guide to paths opens by itself the first time a companion's path is opened, then
; sets this. false shows it again; it is always under the ? on the path page, or F1.
bPathsGuideSeen = false

[Debug]
; Log every target change and style rebuild.
bLogDecisions = false
