; Fight With Me
; Battle orders for your companions. Orders for each companion are set in the
; battle plan and kept in your save; this file holds the rules behind them.
;
; Forms are written as Plugin|0xLocalID. Leave one empty to turn that effect off.

[General]
bEnabled = true
; How far a role pulls a companion's own combat style, 0 to 1. At 0 a role only
; changes whom they fight; at 1 it replaces their style outright.
fStyleWeight = 0.75
; Seconds between target decisions.
fDecisionInterval = 0.3
; The first time a companion is seen, pick a role from what they carry (shield:
; Tank, two-hander: Bruiser, bow: Archer, staff or spells: Mage or Healer) or
; from their NFF combat role.
bGuessRoles = true
; End a companion's combat once no enemy is left (weapons out, nobody to fight), so
; they fall back into Walk With Me's formation.
bLeaveEmptyFights = true
fLeaveAfter = 2.5

[Orders]
; Party orders for the whole fight, with or without the battle plan open. They bend
; everyone's orders until the fight is over and never change what each one was told.
; DirectInput scan codes, laid out like a D-pad on the numpad. 0 = none.
; Attack!: everyone goes for your target. 72 = Numpad 8.
iAttack = 72
; To me!: everyone comes back to your side and fights there. 77 = Numpad 6.
iToMe = 77
; Hold back: everyone stays back. 75 = Numpad 4.
iHoldBack = 75
; As you were: everyone back to their own orders. 80 = Numpad 2.
iAsYouWere = 80

[BattlePlan]
; DirectInput scan code. 71 = Numpad 7. 0 = none.
iKey = 71
; Gamepad: hold LB and press this button. 1 D-pad up, 2 D-pad down, 4 left,
; 8 right, 4096 A, 8192 B, 16384 X, 32768 Y, 128 right stick. 0 = none.
iGamepadKey = 2
; How fast the world runs while the plan is open.
fTimeScale = 0.1
; Pause the game instead of slowing it.
bStopTime = false
; Seconds to ease in and out of slow time.
fEaseSeconds = 0.25
; The Slow Time shout's screen effect while planning. It washes the picture out.
bTimeEffect = false
; Hide the HUD (and other interface movies) while planning.
bHideHUD = true
; Ease the camera over to the companion you are commanding, and back on close.
bCameraGlide = true
fCameraDistance = 260
fCameraHeight = 70
; With no enemies about, the camera comes face to face with the chosen companion, this close.
fPortraitDistance = 95
; Menu scale on top of the screen-height scaling.
fScale = 1.0

[Taunt]
bEnabled = true
; Taunt once as a fight starts, before anyone is in trouble.
bOpener = true
; A tank with a shield raises it against archers and casters shooting at them, turned
; to the nearest and closing on them behind it, and lowers it to fight once anything
; comes within reach.
bShieldWall = true
; Once a taunt is ready, a tank checks every fCheckSeconds and taunts with this
; chance, so taunts come at uneven, natural intervals.
fChance = 0.35
fCheckSeconds = 2
; Reach: 800 units plus 3 per point of the better of Block and Heavy Armor.
fRadiusBase = 800
fRadiusPerSkill = 3
fRadiusMax = 1200
; A tank holds enemies up to their own level plus level / fReachDivisor for
; certain. Each level beyond that loses fFalloffPerLevel of the chance, and
; nothing more than iFalloffLevels beyond can be held at all.
fReachDivisor = 4
fFalloffPerLevel = 0.12
iFalloffLevels = 8
; Bosses and dragons count as this many levels higher.
iBossLevelBonus = 5
; Enemies this many levels below the tank stay held fCowedHoldMult times longer.
iCowedLevelGap = 10
fCowedHoldMult = 1.5
; Seconds an enemy stays on the tank: fHoldBase + fHoldPerLevel per tank level.
fHoldBase = 5
fHoldPerLevel = 0.05
; Seconds between taunts: fCooldownBase - fCooldownPerLevel per level, at least fCooldownMin.
fCooldownBase = 14
fCooldownPerLevel = 0.05
fCooldownMin = 8
fStaminaCost = 25
; A hold breaks when the tank gets this far from the enemy.
fHoldBreakDistance = 3000
; An archer or caster shooting at you can be taunted from this far, so their fire goes
; to the tank instead of you. Line of sight is still needed.
fRangedReach = 3000
fGlowSeconds = 1.2
sGlowShader = Skyrim.esm|0x0FE68D
sSound = Skyrim.esm|0x0FF86A
; Shield bang, weapon flourish, and the war cry for anyone else.
sIdleShield = Skyrim.esm|0x0B8C74
sIdleWeapon = Skyrim.esm|0x0B8C73
sIdleCry = Skyrim.esm|0x0F7C8C

[Heal]
bEnabled = true
; Let companions with no heal of their own be Healers, borrowing this spell scaled
; by their Restoration skill (0.5 + Restoration / 100). Off: Healer needs a real heal.
bFallback = false
sFallbackSpell = Skyrim.esm|0x04D3F2
; A healer heals themselves only below this, whatever the line for allies.
fSelfThreshold = 0.40
; Seconds between a healer's casts. At least 10.
fCooldown = 15
; Heals are cast from where the healer stands on allies up to this far.
fRange = 1000
; A companion who is down is walked to from up to this far, and healed by hand
; within fReviveDistance. You always come first: a healer on the way turns back
; to heal you if you need it.
fReviveReach = 2500
fReviveDistance = 200
; A concentration spell counts as this many seconds of channelling per heal.
fConcentrationSeconds = 2.5

[Targeting]
; Between two enemies that fit the focus, the nearer is preferred up to this far.
; Distance never rules an enemy out: an ordered target is chased wherever it is.
fEngageRange = 2500
; Guard you: enemies this close to you.
fGuardRadius = 700
; Hold back (melee): enemies this close to the companion.
fHoldBackRadius = 450
; With me (what To me! gives everyone): they keep this close to you and fight there:
; anything that comes near you, anything on you from close by, and an enemy on them
; within fDefendRange. With nothing in reach they hold by you.
fWithMeRadius = 400
; An enemy attacking a companion from this close is dealt with first, whatever their
; focus or position. Your target and a marked enemy are orders and still come first.
fDefendRange = 500
; How much a companion prefers to stay on their current target.
fStickiness = 25
; How much they avoid an enemy others are already on, per ally.
fSpreadPenalty = 15
; Score lost per unit of distance.
fDistanceWeight = 0.04
; Keep companions inside an area around you, as vanilla guards keep to their post:
; they break off chases and come back. Guard you keeps within fGuardRadius, With me
; within fWithMeRadius, Hold back within fHoldBackLeash. Skyrim SE and AE.
bLeash = true
fHoldBackLeash = 1000

[TimeEffect]
sIntro = Skyrim.esm|0x0486F7
sHold = Skyrim.esm|0x0486F4

[Interface]
; Short notices on the HUD when a tank taunts or a healer heals.
bNotices = true
; The game's own menu sounds when you point at and choose orders in the battle plan.
bSounds = true
; Describe each control when you point at it or move to it with the pad.
bTooltips = true

[Debug]
; Log every target change and style rebuild.
bLogDecisions = false
